<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Input Monitoring Panel - PT ARYATEK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { background-color: #f0f4f8; } .input-focus:focus { border-color: #2563eb; ring: 2px #2563eb; } </style>
</head>
<body class="pb-24">
    <header class="bg-blue-700 text-white py-4 px-6 shadow-lg mb-6">
       <img src="logo.png" alt="Logo PT Aryatek" class="mx-auto block h-24 bg-white px-5 py-3 rounded-xl shadow-lg mb-8" onerror="this.style.display='none'">
    </header>

    <main class="max-w-6xl mx-auto px-4">
        <div class="bg-white rounded-xl shadow-md p-6 border border-gray-200 mb-8">
            <h2 class="text-blue-700 font-bold mb-6 border-b pb-2 uppercase text-sm">Input Progress Baru</h2>
            <form id="form_input" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">WBS / Nomor Project</label>
                        <input type="text" id="nomor_project" required class="w-full border-2 p-2.5 rounded-lg outline-none input-focus">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Nama Project</label>
                        <input type="text" id="nama_project" required class="w-full border-2 p-2.5 rounded-lg outline-none input-focus">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">No. Panel / ID</label>
                        <input type="text" id="panel_id" required class="w-full border-2 p-2.5 rounded-lg outline-none input-focus">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Jenis Panel</label>
                        <input type="text" id="jenis_panel" required class="w-full border-2 p-2.5 rounded-lg outline-none input-focus">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Operator PIC</label>
                        <input type="text" id="operator" required class="w-full border-2 p-2.5 rounded-lg outline-none input-focus">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-blue-600 uppercase mb-1">Status / Progress (%)</label>
                        <input type="text" id="progres" required class="w-full border-2 border-blue-200 p-2.5 rounded-lg bg-blue-50 font-bold outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 bg-gray-50 p-4 rounded-lg">
                    <div>
                        <label class="block text-[10px] font-bold text-blue-700 uppercase mb-1">Plan Start</label>
                        <input type="date" id="plan_start" class="w-full border p-2 rounded-md text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-blue-700 uppercase mb-1">Plan Finish</label>
                        <input type="date" id="plan_finish" class="w-full border p-2 rounded-md text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-green-700 uppercase mb-1">Actual Start</label>
                        <input type="date" id="actual_start" class="w-full border p-2 rounded-md text-sm bg-green-50 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-green-700 uppercase mb-1">Actual Finish</label>
                        <input type="date" id="actual_finish" class="w-full border p-2 rounded-md text-sm bg-green-50 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-red-600 uppercase mb-1">Problem / Keterangan</label>
                        <textarea id="keterangan" rows="2" class="w-full border-2 p-2 rounded-lg outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Pilih Line</label>
                        <div class="flex space-x-2 h-12">
                            <button type="button" class="btn-line flex-1 bg-blue-600 text-white rounded-lg font-bold text-xs transition">LINE 1</button>
                            <button type="button" class="btn-line flex-1 bg-gray-200 text-gray-600 rounded-lg font-bold text-xs transition">LINE 2</button>
                            <button type="button" class="btn-line flex-1 bg-gray-200 text-gray-600 rounded-lg font-bold text-xs transition">LINE 3</button>
                        </div>
                        <input type="hidden" id="line_selected" value="LINE 1">
                    </div>
                </div>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-xl font-black text-lg shadow-lg">SIMPAN DATA</button>
            </form>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white rounded-xl shadow-md p-6 border border-yellow-200">
                <h2 class="text-sm font-bold text-yellow-700 mb-5 border-b border-yellow-100 pb-2 uppercase">Update Progres</h2>
                <form id="form_edit" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="flex flex-col">
                            <label class="text-[10px] font-bold text-gray-500 mb-1">1. PILIH PROJECT</label>
                            <select id="edit_project_filter" class="border-2 p-2.5 rounded-lg text-sm bg-gray-50 outline-none"></select>
                        </div>
                        <div class="flex flex-col">
                            <label class="text-[10px] font-bold text-gray-500 mb-1">2. PILIH ID PANEL</label>
                            <select id="target_id" required class="border-2 p-2.5 rounded-lg text-sm bg-yellow-50 outline-none"></select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex flex-col">
                            <label class="text-[10px] font-bold text-gray-500 mb-1">JENIS BARU (OPSIONAL)</label>
                            <input type="text" id="jenis_panel_baru" class="border-2 p-2.5 rounded-lg text-sm outline-none">
                        </div>
                        <div class="flex flex-col">
                            <label class="text-[10px] font-bold text-blue-600 mb-1">PROGRES BARU</label>
                            <input type="text" id="progres_baru" class="border-2 p-2.5 rounded-lg text-sm bg-blue-50 font-bold outline-none">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white py-3 rounded-lg font-bold">UPDATE</button>
                </form>
            </div>

            <div class="bg-white rounded-xl shadow-md p-6 border border-red-200">
                <h2 class="text-sm font-bold text-red-600 mb-5 border-b border-red-100 pb-2 uppercase">Hapus Data</h2>
                <form id="form_delete" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="flex flex-col">
                            <label class="text-[10px] font-bold text-gray-500 mb-1">1. PILIH PROJECT</label>
                            <select id="delete_project_filter" class="border-2 p-2.5 rounded-lg text-sm bg-gray-50 outline-none"></select>
                        </div>
                        <div class="flex flex-col">
                            <label class="text-[10px] font-bold text-gray-500 mb-1">2. PILIH ID PANEL</label>
                            <select id="delete_target_id" required class="border-2 p-2.5 rounded-lg text-sm bg-red-50 outline-none"></select>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-bold mt-10">HAPUS PERMANEN</button>
                </form>
            </div>
        </div>
    </main>

    <div class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3">
        <a href="/export-excel" class="bg-green-600 hover:bg-green-800 text-white px-6 py-3 rounded-full font-bold shadow-xl flex items-center transition border-2 border-white">
            <span class="mr-2">📊</span> EXCEL
        </a>
        <a href="/display.html" class="bg-blue-600 hover:bg-blue-800 text-white px-6 py-3 rounded-full font-bold shadow-xl flex items-center transition border-2 border-white">
            <span class="mr-2">📺</span> MONITOR TV
        </a>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let allPanels = [];

        // Logic Line Produksi
        const lineButtons = document.querySelectorAll('.btn-line');
        const selectedLineInput = document.getElementById('line_selected');
        lineButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                lineButtons.forEach(b => { b.classList.replace('bg-blue-600', 'bg-gray-200'); b.classList.replace('text-white', 'text-gray-600'); });
                this.classList.replace('bg-gray-200', 'bg-blue-600'); this.classList.replace('text-gray-600', 'text-white');
                selectedLineInput.value = this.innerText;
            });
        });

        // Filter Bertingkat
        function refreshDropdowns() {
            fetch("/data").then(res => res.json()).then(data => {
                allPanels = data;
                const projects = [...new Set(data.map(item => item.nama_project))].sort();
                let options = '<option value="">-- Pilih Project --</option>';
                projects.forEach(p => options += `<option value="${p}">${p}</option>`);
                
                document.getElementById("edit_project_filter").innerHTML = options;
                document.getElementById("delete_project_filter").innerHTML = options;
                document.getElementById("target_id").innerHTML = '<option value="">Pilih Project Dulu</option>';
                document.getElementById("delete_target_id").innerHTML = '<option value="">Pilih Project Dulu</option>';
            });
        }

        document.getElementById("edit_project_filter").addEventListener("change", function() {
            const filtered = allPanels.filter(item => item.nama_project === this.value);
            let opts = '<option value="">-- Pilih Panel --</option>';
            filtered.forEach(i => opts += `<option value="${i.id}">${i.panel_id}</option>`);
            document.getElementById("target_id").innerHTML = opts;
        });

        document.getElementById("delete_project_filter").addEventListener("change", function() {
            const filtered = allPanels.filter(item => item.nama_project === this.value);
            let opts = '<option value="">-- Pilih Panel --</option>';
            filtered.forEach(i => opts += `<option value="${i.id}">${i.panel_id}</option>`);
            document.getElementById("delete_target_id").innerHTML = opts;
        });

        refreshDropdowns();
        socket.on("updateData", refreshDropdowns);

        // Submit Logic
        document.getElementById("form_input").onsubmit = (e) => {
            e.preventDefault();
            const payload = {
                nomor_project: document.getElementById("nomor_project").value,
                nama_project: document.getElementById("nama_project").value,
                panel_id: document.getElementById("panel_id").value,
                jenis_panel: document.getElementById("jenis_panel").value,
                operator: document.getElementById("operator").value,
                progres: document.getElementById("progres").value,
                plan_start: document.getElementById("plan_start").value,
                plan_finish: document.getElementById("plan_finish").value,
                actual_start: document.getElementById("actual_start").value,
                actual_finish: document.getElementById("actual_finish").value,
                keterangan: document.getElementById("keterangan").value,
                line: selectedLineInput.value
            };
            fetch("/add", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload) })
            .then(res => { if(res.ok) { alert("Tersimpan!"); e.target.reset(); lineButtons[0].click(); }});
        };

        document.getElementById("form_edit").onsubmit = (e) => {
            e.preventDefault();
            fetch("/update-data", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({
                id: document.getElementById("target_id").value,
                jenis_panel_baru: document.getElementById("jenis_panel_baru").value,
                progres_baru: document.getElementById("progres_baru").value
            })}).then(res => { if(res.ok) { alert("Update Sukses!"); e.target.reset(); }});
        };

        document.getElementById("form_delete").onsubmit = (e) => {
            e.preventDefault();
            if(confirm("Hapus data ini?")) {
                fetch("/delete-data", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ id: document.getElementById("delete_target_id").value }) })
                .then(res => { if(res.ok) alert("Terhapus!"); });
            }
        };
    </script>
</body>
</html>
