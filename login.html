<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Operator - PT ARYATEK</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f0f4f8] h-screen flex items-center justify-center font-sans">
    
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-sm border-t-4 border-blue-600">
        
        <div class="text-center mb-8">
            <img src="/logo.png" alt="Logo PT Aryatek" class="h-20 mx-auto mb-4 p-2 bg-gray-50 rounded-lg shadow-sm" onerror="this.style.display='none'">
            <h2 class="text-2xl font-black text-[#003366] uppercase tracking-wide">Operator Login</h2>
            <p class="text-sm text-gray-500 mt-1">Sistem Input Progress Panel</p>
        </div>
        
        <form action="/api/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Username</label>
                <input 
                    type="text" 
                    name="username" 
                    placeholder="Masukkan username..."
                    required 
                    class="w-full border-2 border-gray-200 p-3 rounded-lg outline-none focus:border-blue-600 focus:bg-blue-50 transition-colors"
                >
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Password</label>
                <input 
                    type="password" 
                    name="password" 
                    placeholder="••••••••"
                    required 
                    class="w-full border-2 border-gray-200 p-3 rounded-lg outline-none focus:border-blue-600 focus:bg-blue-50 transition-colors"
                >
            </div>
            
            <button 
                type="submit" 
                class="w-full bg-[#003366] hover:bg-blue-800 text-white font-bold py-3.5 rounded-lg shadow-md transition-all transform hover:scale-[1.02] mt-2"
            >
                MASUK / LOGIN
            </button>
        </form>

    </div>

</body>
</html>
