<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Monitoring PT. ARYATEK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f6fa; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .header-bg { background-color: #1a56db; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="h-screen flex flex-col relative">

    <div id="startOverlay" onclick="startDisplay()" class="fixed inset-0 bg-blue-900 z-50 flex flex-col items-center justify-center text-white cursor-pointer transition-opacity duration-500">
        <img src="logo.png" alt="Logo PT Aryatek" class="h-24 bg-white px-5 py-3 rounded-xl shadow-lg mb-8" onerror="this.style.display='none'">
        
        <h1 class="text-4xl font-bold mb-4 uppercase tracking-widest text-center">Monitoring LV Panel</h1>
        <p class="text-lg text-blue-200 animate-pulse bg-blue-800 px-6 py-2 rounded-full mt-4 shadow-lg">
            [ Selamat Datang di Display Monitoring Wiring LV Panel PT. ARYATEK ]<br>
        </p>
    </div>

    <header class="header-bg text-white py-4 px-6 flex justify-between items-center shadow-md shrink-0">
        <div class="flex items-center space-x-5">
            <img src="logo.png" alt="Logo PT Aryatek" class="h-20 bg-white px-4 py-2 rounded-md shadow-sm" onerror="this.style.display='none'">
            
            <div>
                <h1 class="text-xl font-bold uppercase tracking-wide">MONITORING PROGRES LV PANEL</h1>
                <p id="liveClock" class="text-sm mt-1 font-semibold text-blue-200 tracking-wider"></p>
            </div>
        </div>
        <div class="flex space-x-3">
            <a href="/input.html" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded text-sm font-bold shadow">KEMBALI KE INPUT</a>
        </div>
    </header>

    <main class="p-6 flex-grow overflow-hidden relative">
        <div id="tableContainer" class="bg-white rounded-lg shadow h-full overflow-y-auto relative scroll-smooth">
            <table class="w-full text-left border-collapse">
                <thead class="sticky top-0 z-10 shadow-sm">
                    <tr class="bg-gray-800 text-white uppercase text-xs font-bold tracking-wider">
                        <th class="px-4 py-5 border-b w-2/12">WBS / No Project</th>
                        <th class="px-4 py-5 border-b w-3/12">Nama Project</th>
                        <th class="px-4 py-5 border-b w-1/12">No Panel</th>
                        <th class="px-4 py-5 border-b w-1/12">Operator</th>
                        <th class="px-4 py-5 border-b w-1/12 text-center text-green-300">Tanggal Mulai</th>
                        <th class="px-4 py-5 border-b w-1/12 text-center">Progress</th>
                        <th class="px-4 py-5 border-b w-3/12">Problem / Keterangan</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="text-gray-700 text-sm">
                    </tbody>
            </table>
        </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/script.js"></script>
    <script>
        var scrollContainer = document.getElementById('tableContainer');
        var isScrolling = false; 
        
        function startDisplay() {
            var docEl = document.documentElement;
            var requestFullScreen = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
            if (requestFullScreen) requestFullScreen.call(docEl);
            document.getElementById('startOverlay').style.opacity = '0';
            setTimeout(() => { document.getElementById('startOverlay').style.display = 'none'; isScrolling = true; }, 500);
        }

        var stuckCounter = 0;
        setInterval(function() {
            if (!scrollContainer || !isScrolling) return;
            var prevScroll = scrollContainer.scrollTop;
            scrollContainer.scrollTop += 1; 
            if (prevScroll === scrollContainer.scrollTop) {
                stuckCounter++;
                if (stuckCounter > 30) {
                    isScrolling = false; 
                    setTimeout(() => { scrollContainer.scrollTop = 0; stuckCounter = 0; setTimeout(() => { isScrolling = true; }, 4000); }, 4000); 
                }
            } else { stuckCounter = 0; }
        }, 30); 
        // ==========================================
        // LOGIKA JAM & TANGGAL REAL-TIME
        // ==========================================
        function updateClock() {
            const now = new Date();
            
            // Format Tanggal (Contoh: Rabu, 25 Februari 2026)
            const optionsDate = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateString = now.toLocaleDateString('id-ID', optionsDate);
            
            // Format Waktu (Contoh: 14:30:05)
            const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            
            // Tampilkan ke elemen HTML
            document.getElementById('liveClock').innerText = `${dateString} | ${timeString} WIB`;
        }

        // Jalankan fungsi setiap 1 detik (1000 milidetik)
        setInterval(updateClock, 1000);
        updateClock(); // Panggil sekali di awal agar tidak menunggu 1 detik pertama

    </script>
</body>
</html>
